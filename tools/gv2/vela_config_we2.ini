# Ethos-U vela system/memory config for the Himax WE2 (Grove Vision AI V2).
# Used verbatim by export_yolov8_gv2.sh:
#   vela --accelerator-config ethos-u55-64 --config tools/gv2/vela_config_we2.ini \
#        --system-config My_Sys_Cfg --memory-mode My_Mem_Mode_Parent ...
# Values are Seeed's published WE2 profile (wiki ma_deploy_yolov8 + the g2_* notebooks).
# This produced the first model firmware 20250102 decoded (2026-09-09).

[System_Config.My_Sys_Cfg]
core_clock=400e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=16
Sram_write_latency=16
Dram_clock_scale=0.75
Dram_burst_length=128
Dram_read_latency=500
Dram_write_latency=250
OnChipFlash_clock_scale=0.25
OffChipFlash_clock_scale=0.015625
OffChipFlash_burst_length=32
OffChipFlash_read_latency=64
OffChipFlash_write_latency=64

[Memory_Mode.My_Mem_Mode_Parent]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0

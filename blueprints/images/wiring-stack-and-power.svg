<svg class="g2-wiring" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" role="img" aria-label="PiSugar contacts the Pi header pins 2, 4, 5 and 6 from underneath. Three wires run from the Pi: pin 6 ground to BiBoard GND, pin 8 TXD to BiBoard RX2, pin 10 RXD to BiBoard TX2. BiBoard plus 5V pins are not wired.">
<style>
.g2-wiring{color:#1d2430;--audio:#7c3aed;--audio-bg:rgba(124,58,237,.10);--biboard:#2563eb;--biboard-bg:rgba(37,99,235,.10);--border:#c9ccd2;--head:#c99a00;--head-bg:rgba(242,194,48,.18);--pisugar:#0d9488;--pisugar-bg:rgba(13,148,136,.12);--reserved-bg:rgba(120,120,130,.08);--wire:#c2410c;--wire-bib:#be185d}
@media (prefers-color-scheme:dark){.g2-wiring{color:#e4e8ef;--audio:#b794f6;--audio-bg:rgba(183,148,246,.14);--biboard:#6aa8ff;--biboard-bg:rgba(106,168,255,.14);--border:#343c4a;--head:#e0b83a;--head-bg:rgba(224,184,58,.16);--pisugar:#3fd8c9;--pisugar-bg:rgba(63,216,201,.14);--reserved-bg:rgba(200,200,210,.07);--wire:#ff9a3c;--wire-bib:#ff7eb6}}
</style>


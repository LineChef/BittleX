<text x="115" y="127" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".85">5 pogo pins touch the</text>
<text x="115" y="142" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".85">header's solder joints:</text>
<text x="115" y="157" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".85">5V→2  5V→4  SCL→5</text>
